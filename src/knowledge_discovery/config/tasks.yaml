paper_search_task:
  description: >
    Search for academic research papers related to: {research_topic}

    First use the query_expander tool to generate several high-recall search variations for
    the     topic. Then call the paper_search tool with the most promising query terms. The tool must
    exclude arXiv preprints and any Crossref/OpenAlex record without verified peer-reviewed
    publication metadata. Deduplicate duplicate papers, prefer DOI-based matches where possible,
    and return only eligible papers including title, authors, year, abstract, citation count,
    source, URL, publication type, venue, and peer-review status.
  expected_output: >
    A JSON-formatted list containing only papers with peer_review_status set to "verified".
  agent: paper_search_agent

research_analysis_task:
  description: >
    Analyze the research landscape for: {research_topic}

    Using the paper search results from the previous task:
    1. Use the novelty_analysis tool with the research topic and the paper search JSON result set.
    2. Cross-check the result with the semantic_reranker tool to confirm relevance and remove near-duplicates.
    3. Optionally use the llm_novelty_scorer tool to obtain a qualitative novelty rationale.
    4. Interpret the heuristic novelty score and identify the most similar papers.
    5. Summarize existing work that overlaps with the proposed idea.
    6. Identify specific research gaps and future opportunities.

    Provide a clear analysis with a novelty score (percentage), existing work list,
    and research gaps.
  expected_output: >
    A structured research analysis containing novelty score, similar papers,
    existing work summary, research gaps, and future research opportunities.
  agent: research_analysis_agent

report_generation_task:
  description: >
    Generate a comprehensive research report for: {research_topic}

    Using outputs from paper search and research analysis tasks, create a
    final report with these sections:

    Include only papers with peer_review_status "verified"; do not add excluded or unverified
    records. State that the report uses a conservative peer-reviewed-only filter.

    1. Executive Summary
    2. Related Papers (with key details and URLs)
    3. Research Analysis (novelty score and interpretation)
    4. Research Gaps
    5. References (all papers with URLs)

    Where helpful, use the paper_summarizer tool to create concise summaries for the most relevant
    works before writing the final report. Write in clear, professional language suitable for
    researchers and students.
  expected_output: >
    A complete markdown research report with all five sections, properly formatted with
    headings, bullet points, and reference links.
  agent: report_agent